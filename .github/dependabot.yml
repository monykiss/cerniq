version: 2
updates:
  - package-ecosystem: npm
    directory: /backend-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-node:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /services/cossec-parser
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cossec-parser:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
